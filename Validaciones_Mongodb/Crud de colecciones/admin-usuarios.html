<!DOCTYPE html>
<html lang="es">
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }
        h2 {
            text-align: center;
            margin-top: 20px;
        }
        form {
            max-width: 600px;
            margin: 32px auto;
            background: #fff;
            padding: 12px 32px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-between;
        }
        form label, form input, form select, form button {
            flex: 1 1 220px;
            min-width: 180px;
        }
        form label {
            margin-top: 0;
        }
        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 4px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 16px;
            margin-right: 8px;
            border: none;
            border-radius: 4px;
            background: #3498db;
            color: #fff;
            cursor: pointer;
        }
        button[type="button"] {
            background: #aaa;
        }
        #message {
            text-align: center;
            margin: 10px auto;
            max-width: 400px;
        }
        table {
            margin: 20px auto;
            width: 90%;
            background: #fff;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background: #eaeaea;
        }
        #loading, #empty-state {
            text-align: center;
            margin: 20px auto;
            color: #888;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Usuarios - SoccerLife Admin</title>
    <!-- Sin estilos: HTML básico -->
</head>
<body>
    <h2>CRUD Usuarios - SoccerLife</h2>
    <div id="message" style="color: red; display: none;"></div>
    <form id="user-form">
        <input type="hidden" id="user-id" value="">
        <label>Nombre Completo *</label>
        <input type="text" id="nombre" name="nombre" required><br>
        <label>Email *</label>
        <input type="email" id="email" name="email" required><br>
        <label>Contraseña *</label>
        <input type="password" id="password" name="password" required><br>
        <label>Posición</label>
        <select id="posicion" name="posicion">
            <option value="">Seleccionar posición</option>
            <option value="Arquero">Arquero</option>
            <option value="Defensa Central">Defensa Central</option>
            <option value="Lateral">Lateral</option>
            <option value="Volante">Volante</option>
            <option value="Extremo">Extremo</option>
            <option value="Delantero">Delantero</option>
        </select><br>
        <label>Número de Jugador</label>
        <input type="number" id="numeroJugador" name="numeroJugador" min="1" max="99"><br>
        <label>Teléfono</label>
        <input type="tel" id="telefono" name="telefono"><br>
        <label>Club</label>
        <input type="text" id="club" name="club"><br>
        <label>Edad</label>
        <input type="number" id="edad" name="edad" min="12" max="100"><br>
        <label>Estatura (cm)</label>
        <input type="number" id="estatura" name="estatura" min="100" max="250"><br>
        <label>Peso (kg)</label>
        <input type="number" id="peso" name="peso" min="30" max="200"><br>
        <button type="submit" id="submit-btn">Crear Usuario</button>
        <button type="button" id="cancel-btn" onclick="cancelEdit()">Cancelar</button>
    </form>
    <hr>
    <input type="text" id="search-input" placeholder="Buscar por nombre, email, club o posición...">
    <button onclick="searchUsers()">Buscar</button>
    <button onclick="loadAllUsers()">Ver Todos</button>
    <div id="loading" style="display:none;">Cargando usuarios...</div>
    <table border="1" id="users-table" style="width:100%; display:none;">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Posición</th>
                <th>Número</th>
                <th>Club</th>
                <th>Edad</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
    </table>
    <div id="empty-state" style="display:none;">No hay usuarios</div>

    <script>
        // Configuración de la API
        const API_URL = 'http://localhost:3000/api/usuarios';
        
        let editingUserId = null;

        // Elementos del DOM
        const userForm = document.getElementById('user-form');
        const messageDiv = document.getElementById('message');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const usersTable = document.getElementById('users-table');
        const usersTbody = document.getElementById('users-tbody');
        const loadingDiv = document.getElementById('loading');
        const emptyStateDiv = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');

        // Cargar usuarios al iniciar
        document.addEventListener('DOMContentLoaded', function() {
            loadAllUsers();
        });

        // Manejar envío del formulario
        userForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(userForm);
            const userData = {};
            
            // Convertir FormData a objeto
            for (let [key, value] of formData) {
                if (value.trim() !== '') {
                    // Convertir números
                    if (['numeroJugador', 'edad', 'estatura', 'peso'].includes(key)) {
                        userData[key] = parseInt(value);
                    } else {
                        userData[key] = value;
                    }
                }
            }

            try {
                let response;
                
                if (editingUserId) {
                    // Actualizar usuario existente
                    response = await fetch(`${API_URL}/${editingUserId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(userData)
                    });
                } else {
                    // Crear nuevo usuario
                    response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(userData)
                    });
                }

                const result = await response.json();

                if (response.ok) {
                    showMessage(
                        editingUserId ? '✅ Usuario actualizado correctamente' : '✅ Usuario creado correctamente', 
                        'success'
                    );
                    userForm.reset();
                    cancelEdit();
                    loadAllUsers();
                } else {
                    showMessage(`❌ Error: ${result.message || 'Error desconocido'}`, 'error');
                }
            } catch (error) {
                showMessage(`❌ Error de conexión: ${error.message}`, 'error');
            }
        });

        // Cargar todos los usuarios
        async function loadAllUsers() {
            showLoading(true);
            
            try {
                const response = await fetch(API_URL);
                const users = await response.json();

                if (response.ok) {
                    displayUsers(users);
                } else {
                    showMessage('❌ Error al cargar usuarios', 'error');
                    showEmptyState();
                }
            } catch (error) {
                showMessage(`❌ Error de conexión: ${error.message}`, 'error');
                showEmptyState();
            }
            
            showLoading(false);
        }

        // Buscar usuarios
        async function searchUsers() {
            const searchTerm = searchInput.value.trim();
            
            if (searchTerm === '') {
                loadAllUsers();
                return;
            }

            showLoading(true);
            
            try {
                const response = await fetch(API_URL);
                const users = await response.json();

                if (response.ok) {
                    // Filtrar usuarios localmente
                    const filteredUsers = users.filter(user => 
                        user.nombre.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        user.email.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (user.club && user.club.toLowerCase().includes(searchTerm.toLowerCase())) ||
                        (user.posicion && user.posicion.toLowerCase().includes(searchTerm.toLowerCase()))
                    );
                    
                    displayUsers(filteredUsers);
                    
                    if (filteredUsers.length === 0) {
                        showMessage(`🔍 No se encontraron usuarios con "${searchTerm}"`, 'error');
                    }
                } else {
                    showMessage('❌ Error al buscar usuarios', 'error');
                }
            } catch (error) {
                showMessage(`❌ Error de conexión: ${error.message}`, 'error');
            }
            
            showLoading(false);
        }

        // Mostrar usuarios en la tabla (diseño básico)
        function displayUsers(users) {
            usersTbody.innerHTML = '';
            if (users.length === 0) {
                showEmptyState();
                return;
            }
            hideEmptyState();
            usersTable.style.display = '';
            users.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${user.nombre}</td>
                    <td>${user.email}</td>
                    <td>${user.posicion || '-'}</td>
                    <td>${user.numeroJugador || '-'}</td>
                    <td>${user.club || '-'}</td>
                    <td>${user.edad || '-'}</td>
                    <td>
                        <button onclick="editUser('${user._id}')">Editar</button>
                        <button onclick="deleteUser('${user._id}', '${user.nombre}')">Eliminar</button>
                    </td>
                `;
                usersTbody.appendChild(row);
            });
        }

        // Editar usuario
        async function editUser(userId) {
            try {
                const response = await fetch(`${API_URL}/${userId}`);
                const user = await response.json();

                if (response.ok) {
                    // Llenar el formulario con los datos del usuario
                    document.getElementById('user-id').value = userId;
                    document.getElementById('nombre').value = user.nombre;
                    document.getElementById('email').value = user.email;
                    document.getElementById('password').value = ''; // No mostrar password actual
                    document.getElementById('posicion').value = user.posicion || '';
                    document.getElementById('numeroJugador').value = user.numeroJugador || '';
                    document.getElementById('telefono').value = user.telefono || '';
                    document.getElementById('club').value = user.club || '';
                    document.getElementById('edad').value = user.edad || '';
                    document.getElementById('estatura').value = user.estatura || '';
                    document.getElementById('peso').value = user.peso || '';

                    // Cambiar el formulario a modo edición
                    editingUserId = userId;
                    formTitle.textContent = '✏️ Editar Usuario';
                    submitBtn.textContent = '💾 Actualizar Usuario';
                    document.getElementById('password').required = false;
                    
                    // Scroll al formulario
                    userForm.scrollIntoView({ behavior: 'smooth' });
                    
                    showMessage('📝 Modo edición activado', 'success');
                } else {
                    showMessage('❌ Error al cargar datos del usuario', 'error');
                }
            } catch (error) {
                showMessage(`❌ Error de conexión: ${error.message}`, 'error');
            }
        }

        // Cancelar edición
        function cancelEdit() {
            editingUserId = null;
            formTitle.textContent = '➕ Crear Nuevo Usuario';
            submitBtn.textContent = '💾 Crear Usuario';
            document.getElementById('user-id').value = '';
            document.getElementById('password').required = true;
            userForm.reset();
        }

        // Eliminar usuario
        async function deleteUser(userId, userName) {
            if (!confirm(`⚠️ ¿Estás seguro de que quieres eliminar al usuario "${userName}"?\n\nEsta acción no se puede deshacer.`)) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${userId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage(`✅ Usuario "${userName}" eliminado correctamente`, 'success');
                    loadAllUsers();
                } else {
                    showMessage(`❌ Error al eliminar usuario: ${result.message}`, 'error');
                }
            } catch (error) {
                showMessage(`❌ Error de conexión: ${error.message}`, 'error');
            }
        }

        // Mostrar mensaje (básico)
        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.style.display = '';
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        // Mostrar/ocultar loading (básico)
        function showLoading(show) {
            if (show) {
                loadingDiv.style.display = '';
                usersTable.style.display = 'none';
                emptyStateDiv.style.display = 'none';
            } else {
                loadingDiv.style.display = 'none';
            }
        }

        // Mostrar estado vacío (básico)
        function showEmptyState() {
            emptyStateDiv.style.display = '';
            usersTable.style.display = 'none';
        }
        // Ocultar estado vacío (básico)
        function hideEmptyState() {
            emptyStateDiv.style.display = 'none';
        }

        // Permitir búsqueda con Enter
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchUsers();
            }
        });
    </script>
</body>
</html>
